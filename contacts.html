<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contacts — Hippy</title>
<meta name="description" content="Contact Hippy / PENNY SIA, Riga, Latvia."/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:    #f6ecd9;
    --paper:    #fbf6ea;
    --mustard:  #e8a33d;
    --terra:    #c9603c;
    --olive:    #6b7a3a;
    --maroon:   #7a2e2e;
    --ink:      #3a2b1c;
    --ink-soft: #6b5a45;
    --border:   #e6d9b8;
  }

  body {
    background: #ffffff;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .patchwork {
    position: absolute; inset: 0;
    background-image: url("boho-bg.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center top;
    opacity: 0.4;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.55) 0%, #ffffff 88%);
  }

  nav {
    position: relative; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.75rem 4rem;
    flex-wrap: wrap; row-gap: 0.75rem;
  }
  .nav-logo { display: flex; align-items: center; }
  .nav-logo img { width: 48px; height: 48px; display: block; }
  .nav-links { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; justify-content: center; }
  .nav-links a {
    text-decoration: none; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    border-bottom: 1px solid transparent; padding-bottom: 3px;
  }
  .nav-links a:hover { border-color: var(--terra); color: var(--terra); }

  .lang-switch { position: relative; display: flex; align-items: center; }
  .lang-globe-btn {
    background: transparent; border: none; color: var(--ink); display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer;
    padding: 0.25rem 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s;
  }
  .lang-globe-btn:hover { color: var(--terra); }
  .lang-globe-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .lang-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0; background: var(--paper);
    border: 1px solid var(--ink); min-width: 90px; z-index: 200; overflow: hidden; border-radius: 8px;
  }
  .lang-dropdown.open { display: block; }
  .lang-option {
    display: block; width: 100%; background: transparent; border: none; padding: 0.6rem 1.1rem; text-align: left;
    font-size: 0.78rem; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); cursor: pointer; transition: background 0.15s;
  }
  .lang-option:hover { background: var(--cream); }
  .lang-option.active { color: var(--terra); }

  main {
    position: relative; z-index: 5;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem 3.5rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(58,43,28,0.06);
  }

  .card h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 2.1rem;
    color: var(--maroon);
    margin-bottom: 2rem;
  }

  .row { margin-bottom: 1.25rem; }
  .label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--olive);
    margin-bottom: 0.25rem;
    font-weight: 500;
  }
  .value { font-size: 0.95rem; color: var(--ink); font-weight: 400; }
  .value a { color: var(--terra); text-decoration: none; }
  .value a:hover { text-decoration: underline; }

  .wa-link { display:inline-flex; align-items:center; margin-left:.4rem; color:#25D366 !important; text-decoration:none !important; vertical-align:middle; line-height:1; }
  .wa-link:hover { color:#1ebe5b !important; }
  .wa-link svg { width:20px; height:20px; flex:none; }

  footer {
    position: relative; z-index: 5;
    text-align: center;
    padding: 1.5rem;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    nav { padding: 1.25rem 1.25rem; justify-content: center; text-align: center; }
    .nav-links { gap: 1rem; justify-content: center; }
    .card { padding: 2.25rem 1.75rem; }
  }
</style>
</head>
<body>

<script>
  let currentLang = 'lv';

  function toggleLangDropdown() {
    document.getElementById('langDropdown').classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    if (!document.getElementById('langSwitch').contains(e.target)) {
      document.getElementById('langDropdown').classList.remove('open');
    }
  });

  function setLang(lang, skipSave) {
    currentLang = lang;
    if (!skipSave) { try { localStorage.setItem('hippy_lang', lang); } catch(e) {} }
    document.getElementById('langDropdown').classList.remove('open');
    document.getElementById('currentLangLabel').textContent = lang.toUpperCase();
    document.querySelectorAll('.lang-option').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
    });
    document.querySelectorAll('[data-en]').forEach(el => {
      const text = el.getAttribute('data-' + lang) || el.getAttribute('data-en');
      if (text) el.innerHTML = text;
    });
    document.documentElement.lang = lang;
  }

  (function() {
    let saved = 'lv';
    try { saved = localStorage.getItem('hippy_lang') || 'lv'; } catch(e) {}
    setLang(saved, true);
  })();
</script>
